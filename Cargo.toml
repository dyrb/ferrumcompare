[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
fc-core = { path = "crates/fc-core" }
ft-ntfs = { path = "crates/ft-ntfs" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem",
    "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Threading",
    "Win32_Globalization",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = false
strip = true
