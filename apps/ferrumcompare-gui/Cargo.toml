[package]
name = "ferrumcompare-gui"
description = "Native Windows folder comparison"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
fc-core.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Shell",
    "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader", "Win32_System_Time", "Win32_System_DataExchange",
    "Win32_System_Memory", "Win32_System_Com", "Win32_System_Ole",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Registry", "Win32_Graphics_Dwm",
    "Win32_UI_Shell_Common",
] }
